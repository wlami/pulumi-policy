name: sdk-java

on:
  push:
    branches: [main, feature/java-policy-sdk-mvp]
    paths:
      - 'sdk/java/**'
      - '.github/workflows/sdk-java.yml'
  pull_request:
    paths:
      - 'sdk/java/**'
      - '.github/workflows/sdk-java.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['11', '17', '21']
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build + test sdk/java
        working-directory: sdk/java
        run: mvn -B -ntp test
